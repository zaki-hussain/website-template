<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <meta name="description" content="{{name}} — personal website"/>
        <link rel="stylesheet" href="css/styles.css"/>
        <title>{{name}}</title>
        <link rel="icon" type="image/x-icon" href="media/logo.jpg"/>
        <link rel="alternate" type="application/rss+xml" title="{{name}}" href="feed.xml"/>
    </head>

    <body>
        <div class="wrapper">
            <header class="identity">
                <h1>{{name}}</h1>
                <nav class="icons" aria-label="Social links">
                    <!-- SOCIALS:START (generated by build.py from config.toml) -->
                    <!-- SOCIALS:END -->
                </nav>
            </header>

            <main class="content">
                <details class="block" name="section" open>
                    <summary class="block-title"><h2>About</h2></summary>
                    <div class="block-body">
                        <!-- ABOUT:START (generated by build.py from config.toml) -->
                        <!-- ABOUT:END -->
                    </div>
                </details>

                <details class="block" name="section">
                    <summary class="block-title"><h2>Playground</h2></summary>
                    <div class="block-body">
                        <p class="block-note">{{playground_note}}</p>
                        <ul class="list list--plain">
                            <!-- PLAYGROUND:START (generated by build.py from config.toml) -->
                            <!-- PLAYGROUND:END -->
                        </ul>
                    </div>
                </details>

                <details class="block" name="section">
                    <summary class="block-title"><h2>Writing</h2></summary>
                    <div class="block-body">
                        <p class="rss-link"><a href="feed.xml">rss</a></p>
                        <ul class="list">
                            <!-- WRITING:START (generated by build.py from content/writings) -->
                            <!-- WRITING:END -->
                        </ul>
                    </div>
                </details>
            </main>
        </div>
    </body>
</html>
