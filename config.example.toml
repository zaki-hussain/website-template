# Copy this file to config.toml and edit it to make the site your own.
# Then put your favicon, social icons, and RSS icon in media/, add your posts to
# content/writing/, and run: python3 build.py

name = "Your Name"

# Favicon filename in media/ (used as the site logo / browser tab icon).
logo = "logo.jpg"

# RSS icon filename in media/ (shown next to the writing list when {{writing}} is used).
# Defaults to "rss.svg" if omitted.
rss_icon = "rss.svg"

# Site domain: used in the RSS feed (https://<domain>/) and for {{subdomains: ...}}.
domain = "example.com"

# YYYY-MM-DD birthdate can be accessed with {{age}}
birthdate = "2000-01-01"

# Social icons in the header. `icon` is a filename in media/.
[[socials]]
label = "GitHub"
href = "https://github.com/your-username/"
icon = "github.svg"

[[socials]]
label = "Email"
href = "mailto:you@example.com"
icon = "email.svg"

# ---------------------------------------------------------------------------
# Sections shown on the home page, rendered in this order. The first one is
# expanded by default; opening any other collapses the rest (no JS involved).
#
# A section is a `title` plus a `text` body written in Markdown — inline HTML
# works too. Placeholders you can drop anywhere in `text`:
#
#   {{age}}                — age computed from birthdate
#   {{writing}}            — the post list from content/writing/ + RSS icon
#   {{subdomains: a, b}}   — bullet list of prefixes linking to
#                            https://<prefix>.<domain>/, .<domain> greyed out
# ---------------------------------------------------------------------------

[[section]]
title = "About"
text = """
Write about yourself in **Markdown** — links, lists, and <em>inline HTML</em> all work.

You can also add your age with {{age}}.
"""

[[section]]
title = "Playground"
text = """
<p class="block-note">Some small things I made and wanted to keep in one place.</p>

{{subdomains: demo, notes}}
"""

[[section]]
title = "Writing"
text = "{{writing}}"
