# Copy this file to config.toml and edit it to make the site your own.
# Then put your favicon and social icons in media/, add your posts to
# content/writings/, and run: python3 build.py

name = "Your Name"

# Favicon filename in media/ (used as the site logo / browser tab icon).
logo = "logo.jpg"

# Site domain: used in the RSS feed (https://<domain>/) and as {{domain}}
# in config strings (e.g. playground link suffixes and hrefs).
domain = "example.com"

# YYYY-MM-DD birthdate can be accessed with {{age}}
birthdate = "2000-01-01"

# Social icons in the header. `icon` is a filename in media/.
[[socials]]
label = "GitHub"
href = "https://github.com/your-username/"
icon = "github.svg"

[[socials]]
label = "Email"
href = "mailto:you@example.com"
icon = "email.svg"

# ---------------------------------------------------------------------------
# Sections shown on the home page, rendered in this order. The first one is
# expanded by default; opening any other collapses the rest (no JS involved).
#
# Every section needs `type` and `title`. Optional on any section: `note`,
# a small grey line shown above the body.
#
# Types:
#   text    — needs `paragraphs`, a list of strings ({{age}} / {{domain}} work)
#   links   — needs `items`, a list of {label, href} tables; an optional
#             `suffix` per item is shown greyed after the label
#             ({{age}} / {{domain}} work in label, suffix, and href)
#   writing — the generated list of posts from content/writings/ + RSS link
# ---------------------------------------------------------------------------

[[section]]
type = "text"
title = "About"
paragraphs = [
    "Write about yourself",
    "You can also add your age with {{age}}",
]

[[section]]
type = "links"
title = "Playground"
note = "Some small things I made and wanted to keep in one place."
items = [
    { label = "demo", suffix = ".{{domain}}", href = "https://demo.{{domain}}/" },
    { label = "notes", suffix = ".{{domain}}", href = "https://notes.{{domain}}/" },
]

[[section]]
type = "writing"
title = "Writing"
